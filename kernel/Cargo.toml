[package]
name = "perfix"
version = "0.2.7"
edition = "2024"

[dependencies]
# Графическая оболочка собирается отдельным crate-ом.
pdesk = { path = "../pdesk" }





# Ядро и pdesk собираются в dev-профиле, но без оптимизации отрисовка
# текста и перетаскивание окон в QEMU заметно медленнее. Включаем
# оптимизацию, сохраняя отладочную информацию.
[profile.dev]
opt-level = 2
