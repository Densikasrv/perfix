[package]
name = "perfix"
version = "0.2.8"
edition = "2024"

[features]
# Доверять дополнительному корневому сертификату из tls/dev-root.der.
# Используется только при локальных испытаниях TLS (openssl s_server):
# в обычной сборке флаг выключен, и тестовый корень не принимается.
dev-root = []

[dependencies]
# Графическая оболочка собирается отдельным crate-ом.
pdesk = { path = "../pdesk" }





# Ядро и pdesk собираются в dev-профиле. Оптимизация по размеру
# ("s") уменьшает образ и оставляет больше памяти под арену: консоль,
# Perfbrowse и pfpak работают даже при 6 МиБ RAM. Оптимизация по
# скорости (opt-level = 2) увеличивала .text примерно на 128 КиБ.
[profile.dev]
opt-level = "s"
